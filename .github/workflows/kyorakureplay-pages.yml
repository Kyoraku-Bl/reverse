name: KyorakuReplay site

# Publishes only the fxreplay/ folder to GitHub Pages.
#
# Why a workflow instead of "Deploy from a branch": the repository also holds
# the REA toolchain (~5,500 files), and letting Pages copy the whole tree from
# the branch root is slow and fragile. The artifact below contains exactly the
# 28 files of the website, so the deploy takes seconds and
#   https://<owner>.github.io/<repo>/        serves the site root directly,
#   https://<owner>.github.io/<repo>/replay.html   the terminal.
#
# Repository setup: Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [arena/145acf38-reverse]
    paths:
      - "fxreplay/**"
      - ".github/workflows/kyorakureplay-pages.yml"
  schedule:
    # Refresh the market snapshot every 30 minutes. Scheduled runs only fire
    # when this branch is the repository default; manual runs always work.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated instruments (empty = all 103)"
        required: false
        default: ""
      deadline:
        description: "Seconds before the snapshot job stops starting new instruments"
        required: false
        default: "600"

permissions:
  contents: write          # only to commit the small snapshot status file
  pages: write
  id-token: write

concurrency:
  group: kyorakureplay-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage the website
        run: |
          mkdir -p _site
          rsync -a fxreplay/ _site/ --exclude 'tests' --exclude 'scripts'
          test -f _site/index.html
          test -f _site/replay.html
          du -sh _site

      - name: Set up Node for the market snapshot
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Probe upstream reachability
        continue-on-error: true
        run: |
          node - <<'JS'
          const fs = require("fs");
          const y = "https://query1.finance.yahoo.com/v8/finance/chart/%5ENDX?interval=1d&range=5d";
          const targets = {
            yahoo_query1: y,
            yahoo_query2: y.replace("query1", "query2"),
            binance_vision: "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=5",
            relay_jina: "https://r.jina.ai/" + y,
            relay_allorigins: "https://api.allorigins.win/raw?url=" + encodeURIComponent(y),
            relay_codetabs: "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(y),
          };
          (async () => {
            const out = {};
            for (const [name, url] of Object.entries(targets)) {
              const t0 = Date.now();
              try {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 15000);
                const r = await fetch(url, { headers: { "User-Agent": "Mozilla/5.0", Accept: "*/*" } });
                clearTimeout(timer);
                const body = await r.text();
                out[name] = { status: r.status, ms: Date.now() - t0, bytes: body.length,
                              json: body.trim().startsWith("{") || body.includes('"chart"') };
              } catch (e) {
                out[name] = { error: String(e && e.message || e).slice(0, 120), ms: Date.now() - t0 };
              }
            }
            fs.writeFileSync("_site/data-probe.json", JSON.stringify({ at: new Date().toISOString(), targets: out }, null, 1));
            console.log(JSON.stringify(out));
          })();
          JS

      - name: Fetch real market data (Yahoo Finance + Binance)
        # A provider outage must never block a deploy: the site keeps working
        # with the live feed or the labelled fallback. The script stops itself
        # after 10 minutes, keeping everything it already fetched, and NAS100 /
        # NQ futures are fetched first.
        continue-on-error: true
        timeout-minutes: 14
        env:
          ONLY: ${{ inputs.only }}
          DEADLINE: ${{ inputs.deadline || '600' }}
        run: |
          node fxreplay/scripts/fetch-market-data.mjs \
            --out _site/data --concurrency 6 --deadline "${DEADLINE:-300}" ${ONLY:+--only "$ONLY"}
          du -sh _site/data || true
          ls _site/data | head -5 || true

      - name: Publish the snapshot status
        # Runner logs are not always reachable, so the job also commits a tiny
        # status file (fetched / failed / why). It is only committed when the
        # result actually changes, so a healthy schedule stays quiet.
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, pathlib
          src = pathlib.Path("_site/data-status.json")
          doc = json.loads(src.read_text()) if src.exists() else {
              "ok": 0, "requested": 0, "failed": ["the snapshot script wrote no report"], "partial": {}
          }
          doc.pop("at", None)
          probe = pathlib.Path("_site/data-probe.json")
          if probe.exists():
              pd = json.loads(probe.read_text())
              pd.pop("at", None)
              doc["probe"] = pd.get("targets", {})
          if doc.get("failed") == [] and doc.get("ok", 0) == doc.get("requested"):
              pass
          dst = pathlib.Path("market-data-status.json")
          new = json.dumps(doc, indent=1, sort_keys=True) + "\n"
          old = dst.read_text() if dst.exists() else ""
          if old == new:
              print("status unchanged")
          else:
              dst.write_text(new)
              print("status updated")
          PY
          git add market-data-status.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Market snapshot status: $(python3 -c "import json;d=json.load(open('market-data-status.json'));print(str(d['ok'])+'/'+str(d['requested'])+' instruments')")"
          git push

      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
