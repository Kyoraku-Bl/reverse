name: KyorakuReplay site

# Publishes only the fxreplay/ folder to GitHub Pages.
#
# Why a workflow instead of "Deploy from a branch": the repository also holds
# the REA toolchain (~5,500 files), and letting Pages copy the whole tree from
# the branch root is slow and fragile. The artifact below contains exactly the
# 28 files of the website, so the deploy takes seconds and
#   https://<owner>.github.io/<repo>/        serves the site root directly,
#   https://<owner>.github.io/<repo>/replay.html   the terminal.
#
# Repository setup: Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [arena/145acf38-reverse]
    paths:
      - "fxreplay/**"
      - ".github/workflows/kyorakureplay-pages.yml"
  schedule:
    # Refresh the market snapshot every 30 minutes. Scheduled runs only fire
    # when this branch is the repository default; manual runs always work.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kyorakureplay-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage the website
        run: |
          mkdir -p _site
          rsync -a fxreplay/ _site/ --exclude 'tests' --exclude 'scripts'
          test -f _site/index.html
          test -f _site/replay.html
          du -sh _site

      - name: Set up Node for the market snapshot
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch real market data (Yahoo Finance + Binance)
        # A provider outage must never block a deploy: the site keeps working
        # with the live feed or the labelled fallback. The script stops itself
        # after 10 minutes, keeping everything it already fetched, and NAS100 /
        # NQ futures are fetched first.
        continue-on-error: true
        timeout-minutes: 14
        run: |
          node fxreplay/scripts/fetch-market-data.mjs --out _site/data --concurrency 5 --deadline 600
          du -sh _site/data || true
          ls _site/data | head -5 || true

      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
