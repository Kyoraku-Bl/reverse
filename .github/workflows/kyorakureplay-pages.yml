name: KyorakuReplay site

# Publishes only the site/ folder to GitHub Pages, after refreshing the market
# snapshot that ships with it.
#
#   https://<owner>.github.io/<repo>/              landing page
#   https://<owner>.github.io/<repo>/terminal.html the replay terminal
#   https://<owner>.github.io/<repo>/data/NQ.json  the real candles the terminal reads
#
# Repository setup: Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [arena/145acf38-reverse]
    paths:
      - "site/**"
      - ".github/workflows/kyorakureplay-pages.yml"
  schedule:
    # Refresh the market snapshot every 30 minutes (schedules only fire on the
    # repository default branch; manual runs always work).
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated instruments (empty = all)"
        required: false
        default: ""
      deadline:
        description: "Seconds before the snapshot job stops starting new instruments"
        required: false
        default: "600"
      max_age:
        description: "Reuse snapshot files younger than this many minutes (0 = refetch all)"
        required: false
        default: "20"

permissions:
  contents: write          # only to commit the small snapshot status file
  pages: write
  id-token: write

concurrency:
  group: kyorakureplay-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage the website
        run: |
          mkdir -p _site
          rsync -a site/ _site/ --exclude 'scripts' --exclude 'tests' --exclude 'data'
          test -f _site/index.html
          test -f _site/terminal.html
          du -sh _site

      - name: Set up Node for the market snapshot
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Keep the previous market snapshot
        # A run that cannot reach a provider must not blank the chart: the newest
        # snapshot is restored first and only overwritten per file.
        uses: actions/cache@v4
        with:
          path: _site/data
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      - name: Probe upstream reachability
        continue-on-error: true
        run: |
          node - <<'JS'
          const fs = require("fs");
          const y = "https://query1.finance.yahoo.com/v8/finance/chart/%5ENDX?interval=1d&range=5d";
          const targets = {
            yahoo_query1: y,
            yahoo_query2: y.replace("query1", "query2"),
            binance_vision: "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=5",
            relay_jina: "https://r.jina.ai/" + y,
            relay_allorigins: "https://api.allorigins.win/raw?url=" + encodeURIComponent(y),
            relay_codetabs: "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(y),
          };
          (async () => {
            const out = {};
            for (const [name, url] of Object.entries(targets)) {
              const t0 = Date.now();
              try {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 15000);
                const r = await fetch(url, { headers: { "User-Agent": "Mozilla/5.0", Accept: "*/*" } });
                clearTimeout(timer);
                const body = await r.text();
                out[name] = { status: r.status, ms: Date.now() - t0, bytes: body.length,
                              json: body.trim().startsWith("{") || body.includes('"chart"') };
              } catch (e) {
                out[name] = { error: String((e && e.message) || e).slice(0, 120), ms: Date.now() - t0 };
              }
            }
            fs.writeFileSync("_site/data-probe.json", JSON.stringify({ at: new Date().toISOString(), targets: out }, null, 1));
            console.log(JSON.stringify(out));
          })();
          JS

      - name: Fetch real market data
        # A provider outage must never block a deploy: the site keeps working with
        # the previous snapshot or the live feed. NQ, ES and NAS100 are fetched
        # first, and anything throttled gets a second pass at the end.
        continue-on-error: true
        timeout-minutes: 16
        env:
          ONLY: ${{ inputs.only }}
          DEADLINE: ${{ inputs.deadline || '600' }}
          MAX_AGE: ${{ inputs.max_age || '20' }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          set +e
          node site/scripts/fetch-data.mjs \
            --out "$GITHUB_WORKSPACE/_site/data" --concurrency 6 \
            --deadline "${DEADLINE:-600}" --max-age "${MAX_AGE:-20}" \
            ${ONLY:+--only "$ONLY"}
          code=$?
          echo "snapshot exit code: $code"
          du -sh _site/data 2>/dev/null || true
          ls _site/data 2>/dev/null | head -5 || true
          echo "--- snapshot report ---"
          head -c 1200 _site/data-status.json 2>/dev/null || echo "no report written"
          exit 0

      - name: Publish the snapshot status
        # Runner logs are not always reachable, so the job also commits a tiny
        # status file (fetched / failed / why) when the result changes.
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, pathlib
          src = pathlib.Path("_site/data-status.json")
          if src.exists():
              doc = json.loads(src.read_text())
          else:
              doc = {"ok": 0, "requested": 0, "failed": ["the snapshot script wrote no report"],
                     "partial": {}, "skipped": 0}
          doc.pop("at", None)
          probe = pathlib.Path("_site/data-probe.json")
          if probe.exists():
              pd = json.loads(probe.read_text())
              pd.pop("at", None)
              doc["probe"] = pd.get("targets", {})
          dst = pathlib.Path("market-data-status.json")
          new = json.dumps(doc, indent=1, sort_keys=True) + "\n"
          old = dst.read_text() if dst.exists() else ""
          if old == new:
              print("status unchanged")
          else:
              dst.write_text(new)
              print("status updated")
          PY
          git add market-data-status.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Market snapshot status: $(python3 -c "import json;d=json.load(open('market-data-status.json'));print(str(d['ok'])+'/'+str(d['requested'])+' instruments')")"
          git push

      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
