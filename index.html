<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KyorakuReplay</title>
<link rel="canonical" href="./fxreplay/">
<meta http-equiv="refresh" content="0; url=./fxreplay/">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    background:radial-gradient(1000px 600px at 50% -10%,#1d1b3a,#0a0c16 60%);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e7e9f3;
  }
  .card{text-align:center;padding:34px 30px;border-radius:18px;border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.035);backdrop-filter:blur(10px);max-width:min(92vw,430px)}
  .mark{width:46px;height:46px;border-radius:13px;margin:0 auto 16px;display:grid;place-items:center;
    background:linear-gradient(135deg,#a78bfa,#7c6bff 55%,#4d6bff);font-weight:800;font-size:19px;color:#fff}
  h1{margin:0 0 6px;font-size:1.16rem;letter-spacing:-.01em}
  h1 span{color:#a78bfa}
  p{margin:0 0 18px;color:#9aa3bb;font-size:.86rem}
  a.btn{display:inline-block;padding:10px 18px;border-radius:10px;text-decoration:none;
    background:linear-gradient(135deg,#8b6bff,#5d6bff);color:#fff;font-weight:600;font-size:.86rem}
  code{font-size:.72rem;color:#7f8aa6}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">K</div>
    <h1>Kyoraku<span>Replay</span></h1>
    <p>Opening the replay terminal…</p>
    <a class="btn" href="./fxreplay/">Enter &rarr;</a>
    <p style="margin:16px 0 0"><code>real market data · Yahoo Finance &amp; Binance</code></p>
  </div>
  <script>location.replace("./fxreplay/");</script>
</body>
</html>
